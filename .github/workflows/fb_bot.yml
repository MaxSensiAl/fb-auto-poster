name: Instagram Style AI Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # हर 30 मिनट में
  workflow_dispatch:  # Manual Run

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'  # ✅ कैशिंग जोड़ने से हर बार पैकेज इंस्टॉल होने में समय बचेगा

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # ❌ playwright install chromium लाइन को यहाँ से पूरी तरह हटा दिया गया है

    - name: Run AI Bot
      env:
        IG_USERNAME: ${{ secrets.IG_USERNAME }}
        IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        TARGET_PROFILE: ${{ secrets.TARGET_PROFILE }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        GEMINI_API: ${{ secrets.GEMINI_API }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      run: |
        python instagram_style_bot.py

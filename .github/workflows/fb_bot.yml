name: FB Auto Poster Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # हर 30 मिनट में ऑटोमैटिक चलेगा
  workflow_dispatch:        # मैन्युअली चलाने के लिए

jobs:
  post-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FB Bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GEMINI_API: ${{ secrets.GEMINI_API }}  # ✅ नया जेमिनी सीक्रेट
        run: python fb_bot.py

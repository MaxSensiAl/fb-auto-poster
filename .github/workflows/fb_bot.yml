name: Auto Facebook Post Bot

on:
  schedule:
    - cron: '*/30 * * * *' # यह हर 30 मिनट में ट्रिगर होगा
  workflow_dispatch: # मैनुअल रूप से चलाने के लिए

jobs:
  post-to-fb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run FB Bot Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          # 0 से 180 सेकंड (3 मिनट) के बीच रैंडम डिले जनरेट करेगा
          DELAY=$(( RANDOM % 181 ))
          echo "Waiting for $DELAY seconds to randomize post timing..."
          sleep $DELAY
          python fb_bot.py
